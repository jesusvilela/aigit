models:
  - name: gpt-4.1
    display_name: GPT-4.1
    description: Default OpenAI coding model for the AIGit DeerFlow harness.
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1
    api_key: $OPENAI_API_KEY
    max_tokens: 8192
    temperature: 0.2

  - name: gpt-4o
    display_name: GPT-4o
    description: Balanced multimodal model for operator-facing DeerFlow tasks.
    use: langchain_openai:ChatOpenAI
    model: gpt-4o
    api_key: $OPENAI_API_KEY
    max_tokens: 8192
    temperature: 0.2

  - name: gpt-4o-mini
    display_name: GPT-4o Mini
    description: Fast low-cost model for lightweight DeerFlow loops.
    use: langchain_openai:ChatOpenAI
    model: gpt-4o-mini
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.2

  - name: gpt-4.1-mini
    display_name: GPT-4.1 Mini
    description: Fast OpenAI fallback for code review and status updates.
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1-mini
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.2

  - name: gpt-4.1-nano
    display_name: GPT-4.1 Nano
    description: Cheapest OpenAI model for titles, summaries, and quick planning.
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1-nano
    api_key: $OPENAI_API_KEY
    max_tokens: 2048
    temperature: 0.2

  - name: claude-sonnet-4
    display_name: Claude Sonnet 4
    description: Frontier review model for release-critical AIGit changes.
    use: langchain_anthropic:ChatAnthropic
    model: claude-sonnet-4-20250514
    api_key: $ANTHROPIC_API_KEY
    max_tokens: 8192
    supports_vision: true
    supports_thinking: true
    when_thinking_enabled:
      thinking:
        type: enabled

  - name: gemini-2.5-pro
    display_name: Gemini 2.5 Pro
    description: Long-context synthesis model for roadmap and repo-wide reasoning.
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.5-pro
    google_api_key: $GOOGLE_API_KEY
    max_tokens: 8192
    supports_vision: true

  - name: deepseek-reasoner
    display_name: DeepSeek Reasoner
    description: Native DeepSeek reasoning model for semantic diff and merge analysis.
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: deepseek-reasoner
    api_key: $DEEPSEEK_API_KEY
    max_tokens: 16384
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

  - name: kimi-k2.5
    display_name: Kimi K2.5
    description: Moonshot large-context model for multi-epic planning and synthesis.
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: kimi-k2.5
    api_base: https://api.moonshot.cn/v1
    api_key: $MOONSHOT_API_KEY
    max_tokens: 32768
    supports_thinking: true
    supports_vision: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

  - name: deepseek-v3.2
    display_name: DeepSeek V3.2
    description: OpenAI-compatible DeepSeek V3.2 access through Novita for coding-heavy flows.
    use: langchain_openai:ChatOpenAI
    model: deepseek/deepseek-v3.2
    api_key: $NOVITA_API_KEY
    base_url: https://api.novita.ai/openai
    max_tokens: 8192
    temperature: 0.1
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

tool_groups:
  - name: file:read
  - name: file:write
  - name: bash

tools:
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  workspace_repo_subdir: repo
  mounts:
    - host_path: "/workspaces/aigit"
      container_path: "/workspaces/aigit"
      read_only: false

skills:
  path: "/workspaces/aigit/skills/custom"
  container_path: /mnt/skills

subagents:
  timeout_seconds: 1800
  agents:
    general-purpose:
      timeout_seconds: 2400
    bash:
      timeout_seconds: 600

channels:
  session:
    assistant_id: aigit-orchestrator
    config:
      recursion_limit: 120
    context:
      thinking_enabled: true
      is_plan_mode: true
      subagent_enabled: true
