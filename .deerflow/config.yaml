models:
  - name: gpt-4.1
    display_name: GPT-4.1
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1
    api_key: $OPENAI_API_KEY
    max_tokens: 8192
    temperature: 0.2

  - name: gpt-4o
    display_name: GPT-4o
    use: langchain_openai:ChatOpenAI
    model: gpt-4o
    api_key: $OPENAI_API_KEY
    max_tokens: 8192
    temperature: 0.2

  - name: gpt-4o-mini
    display_name: GPT-4o Mini
    use: langchain_openai:ChatOpenAI
    model: gpt-4o-mini
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.2

sandbox:
  use: deerflow.community.docker_sandbox:DockerSandboxProvider
  - name: gpt-4.1-mini
    display_name: GPT-4.1 Mini
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1-mini
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.2

  - name: gpt-4.1-nano
    display_name: GPT-4.1 Nano
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1-nano
    api_key: $OPENAI_API_KEY
    max_tokens: 2048
    temperature: 0.2

tool_groups:
  - name: file:read
  - name: file:write
  - name: bash

tools:
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  workspace_repo_subdir: repo
  mounts:
    - host_path: "/workspaces/aigit"
      container_path: "/workspaces/aigit"
      read_only: false

channels:
  session:
    assistant_id: lead_agent
    config:
      recursion_limit: 120
    context:
      thinking_enabled: true
      is_plan_mode: true
      subagent_enabled: true
