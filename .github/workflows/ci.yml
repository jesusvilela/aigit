name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uv-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate uv lockfile
        run: |
          uv lock --check
          uv sync --extra dev --locked

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Byte-compile all sources (catches version-specific syntax)
        run: python -m compileall -q aigit tests

      - name: Remove disposable caches
        run: |
          find . -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +

      - name: Run tests
        run: pytest -q

  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Remove disposable caches
        run: |
          find . -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +

      - name: Rebuild semantic artifacts
        run: python -m aigit.cli chunk --repo .

      - name: Run lineage replay evidence
        run: |
          python -m aigit.cli eval-lineage \
            --fixtures tests/fixtures/lineage_replay_v1.json \
            --min-precision 0.95 \
            --min-recall 0.90 \
            --output lineage-replay-report.json

      - name: Fail on stale semantic artifacts
        run: git diff --exit-code -- .semantic

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: uv-lock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distribution artifacts
        run: uv build

      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/aigit-wheel-test
          /tmp/aigit-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/aigit-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aigit-wheel-test/bin/aigit --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aigit-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
