name: Semantic Merge

# Hosted merge buttons run no custom merge driver. When a pull request
# conflicts with its base only in .semantic/ artifacts, merge the base in with
# the AIGit driver so the button works again. Source conflicts are left alone.
#
# A push made with the default GITHUB_TOKEN leaves the pull request's workflow
# runs awaiting approval; the script approves them so their checks report on
# the pull request, and dispatches CI if it may not. With an AIGIT_BOT_TOKEN
# secret (contents: write) the push starts CI normally.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: semantic-merge
  cancel-in-progress: false

jobs:
  resolve:
    # Pull requests from forks get a read-only token and cannot be pushed to.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The default branch, not the pull request: a conflicting pull
          # request has no merge ref, and the script should be the trusted one.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.AIGIT_BOT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Resolve semantic-only conflicts
        env:
          GH_TOKEN: ${{ secrets.AIGIT_BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AIGIT_DISPATCH_CI: ${{ secrets.AIGIT_BOT_TOKEN == '' && 'ci.yml' || '' }}
        run: |
          # The script runs from the default branch, so the pull request that
          # introduces it has none to run yet.
          if [ ! -x scripts/resolve_semantic_conflicts.sh ]; then
            echo '::notice::scripts/resolve_semantic_conflicts.sh is not on the default branch yet; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./scripts/resolve_semantic_conflicts.sh ${PR_NUMBER}
