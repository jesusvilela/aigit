name: Semantic Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-semantic-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refresh semantic artifacts
        run: ./scripts/ci_refresh_semantics.sh

      - name: Create maintenance pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/semantic-maintenance
          commit-message: 'ci: refresh semantic artifacts'
          title: 'ci: refresh semantic artifacts'
          body: |
            Automated semantic refresh generated by the maintenance workflow.

            Safety properties:
            - runs tests before updating artifacts
            - only includes .semantic/** in the PR
            - opens a pull request instead of pushing to main
          add-paths: |
            .semantic/**
          delete-branch: true
