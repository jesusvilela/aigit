version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  # uv, not pip: the pip ecosystem bumped pyproject.toml without uv.lock,
  # and every such pull request failed `uv lock --check`.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
