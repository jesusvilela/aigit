[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigit"
version = "0.1.0"
description = "AI-native semantic version control layer built on Git"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aigit = "aigit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["aigit*"]
exclude = ["skills*", "docs*", "tests*"]
